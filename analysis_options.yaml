# Minimal, dependency-free lint set (no flutter_lints pin needed).
analyzer:
  exclude:
    - build/**
    - android/**
  language:
    strict-casts: true
    strict-raw-types: true
linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_final_fields
    - avoid_print
    - unawaited_futures
